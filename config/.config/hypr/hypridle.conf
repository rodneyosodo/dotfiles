# hypridle: locks, dims and suspends when idle, and locks before sleep.
# Runs as the hypridle.service user unit.

general {
    lock_cmd = pidof hyprlock || hyprlock                             # one hyprlock at a time
    before_sleep_cmd = loginctl lock-session                          # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' # screen on after resume
}

# Dim the backlight (amdgpu_bl1) after 2.5 min.
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# Lock after 5 min.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Screen off after 5.5 min.
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# Suspend after 30 min.
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
