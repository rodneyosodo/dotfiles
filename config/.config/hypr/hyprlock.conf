# hyprlock: Catppuccin Mocha, matching the Quickshell bar.
# Clear the password: Esc, Ctrl+U or Ctrl+Backspace.

$font = CodeNewRoman Nerd Font Propo

$text = rgb(cdd6f4)
$subtext = rgba(cdd6f4aa)
$accent = rgb(cba6f7)
$base = rgba(1e1e2eaa)
$green = rgb(a6e3a1)
$red = rgb(f38ba8)
$yellow = rgb(f9e2af)

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = ~/.config/wallpaper/wallpaper.jpg
    color = rgb(1e1e2e)
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
}

# Time
label {
    monitor =
    text = $TIME
    color = $text
    font_size = 96
    font_family = $font
    position = 0, 160
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $subtext
    font_size = 22
    font_family = $font
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    rounding = 16

    inner_color = $base
    outer_color = $accent
    check_color = $green
    fail_color = $red
    capslock_color = $yellow

    font_color = $text
    font_family = $font
    placeholder_text = <i>Password</i>
    fail_text = $PAMFAIL
    fade_on_empty = false
    dots_spacing = 0.3

    position = 0, -40
    halign = center
    valign = center
}

# User
label {
    monitor =
    text = $USER
    color = $subtext
    font_size = 14
    font_family = $font
    position = 0, -110
    halign = center
    valign = center
}
