- name: Go Setup After Install
  hosts: 127.0.0.1
  vars:
    # Installed with `go install <entry>`: flags (if any), then module@version.
    # Kept up to date by `make export-go-packages`, which only rewrites this list.
    go_tools:
      - '-ldflags "-s -w" github.com/tristanisham/zvm@latest'
      - github.com/Zxilly/go-size-analyzer/cmd/gsa@latest
      - github.com/asdf-vm/asdf/cmd/asdf@latest
      - github.com/derailed/k9s@latest
      - github.com/go-critic/go-critic/cmd/gocritic@latest
      - github.com/go-delve/delve/cmd/dlv@latest
      - github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - github.com/google/pprof@latest
      - github.com/goreleaser/goreleaser/v2@latest
      - github.com/jesseduffield/lazygit@latest
      - github.com/oligot/go-mod-upgrade@latest
      - github.com/orlangure/gocovsh@latest
      - github.com/ramonvermeulen/whosthere@latest
      - github.com/vektra/mockery/v3@latest
      - go.uber.org/nilaway/cmd/nilaway@latest
      - golang.org/x/tools/cmd/godoc@latest
      - golang.org/x/tools/cmd/goimports@latest
      - golang.org/x/tools/gopls@latest
      - google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
      - google.golang.org/protobuf/cmd/protoc-gen-go@latest
  tasks:
    - name: Install Golang if not already installed
      community.general.pacman:
        name:
          - go
        state: present
      become: yes

    # Every item runs; the task fails at the end if any of them did.
    - name: Install Golang Tools
      ansible.builtin.command: "go install {{ item }}"
      loop: "{{ go_tools }}"
