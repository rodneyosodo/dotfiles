- name: Install AMD GPU Utilities
  hosts: 127.0.0.1
  tasks:
    - name: Install AMD GPU Utilities
      community.general.pacman:
        name:
          - amd-ucode
          - amdgpu_top  # in extra; the AUR amdgpu_top-bin is gone
          - mesa
          - xf86-video-amdgpu
          - vulkan-radeon
          - vulkan-icd-loader
          - libva-mesa-driver
        state: present
      become: yes

    # amd-ucode is loaded through the GRUB config.
    - name: Update GRUB
      ansible.builtin.command: grub-mkconfig -o /boot/grub/grub.cfg
      become: yes
