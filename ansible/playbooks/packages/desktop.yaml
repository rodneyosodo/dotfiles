- name: Ping all hosts
  hosts: 127.0.0.1
  vars:
    package_file: "desktop.txt"
  tasks:
    - name: Read package list from file
      slurp:
        src: "{{ package_file }}"
      register: package_file_content
      delegate_to: localhost

    - name: Set package list variable
      set_fact:
        package_list: "{{ (package_file_content['content'] | b64decode).split('\n') | select('regex', '^[a-zA-Z0-9_-]+$') | list }}"

    - name: Run the equivalent of "pacman -Sy" as a separate step
      community.general.pacman:
        update_cache: true
      become: yes
      remote_user: root

    - name: Run the equivalent of "pacman -Su" as a separate step
      community.general.pacman:
        upgrade: true
      become: yes
      remote_user: root

    - name: Configure passwordless sudo for pacman
      copy:
        dest: /etc/sudoers.d/11-install-aur
        content: |
          {{ ansible_facts['env']['USER'] }} ALL=(ALL) NOPASSWD: /usr/bin/pacman
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
      become: yes

    - name: Ensure build directory exists with correct permissions
      file:
        path: "{{ ansible_facts['env']['HOME'] }}/.cache/yay"
        state: directory
        owner: "{{ ansible_facts['env']['USER'] }}"
        mode: "0755"
      become: no

    - name: Install packages using yay
      kewlfft.aur.aur:
        name: "{{ package_list }}"
        use: yay
        state: latest
      become: no

    # The desktop shell (Hyprland Lua config, Quickshell bar, Hokum, Vicinae,
    # hypridle/hyprlock, dusk) needs these whether or not desktop.txt has
    # them. desktop.txt is regenerated from `pacman -Qqe`, which drops
    # anything installed as a dependency, so they are pinned here instead.
    - name: Install desktop shell packages
      kewlfft.aur.aur:
        name:
          - hyprland
          - quickshell            # bar
          - hokum-bin             # notifications
          - vicinae-bin           # launcher
          - hypridle              # idle: dim, lock, screen off, suspend
          - hyprlock              # lock screen
          - awww                  # wallpaper
          - ghostty               # terminal
          - otf-codenewroman-nerd # bar, lock screen and popup font (Propo)
          - libpulse              # pactl: volume (PulseAudio)
          - pavucontrol
          - playerctl             # media keys
          - brightnessctl         # brightness keys, idle dimming
          - upower                # battery
          - bluez
          - bluez-utils
          - networkmanager        # network item, nmtui
          - btop                  # CPU/memory/disk click
          - flameshot             # SUPER+O
          - libnotify             # notify-send (ai-usagebar, calendar)
          - xdg-utils             # xdg-open for meeting links
          - python                # clock popup calendar sync
          - stow
          # Build dependencies of dusk (rust.yaml)
          - libxkbcommon
          - wayland
          - vulkan-icd-loader
        use: yay
        state: present
      become: no

    - name: Enable desktop shell user services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        scope: user
      loop:
        - hokum.service     # notifications
        - hypridle.service  # idle and lock-before-sleep
      become: no

    # Calendar links are credentials, so the feed list lives outside the
    # dotfiles. Create an empty one, private, without touching an existing
    # file. See config/.config/quickshell/README.md.
    - name: Create the calendar feed list
      ansible.builtin.copy:
        dest: "{{ ansible_facts['env']['HOME'] }}/.config/quickshell-calendars.json"
        content: |
          [
              {
                  "name": "Google",
                  "url": "",
                  "color": "#89b4fa",
                  "enabled": true
              }
          ]
        mode: "0600"
        force: false
      become: no

    - name: Remove unnecessary packages
      community.general.pacman:
        name:
          - gnome-connections
          - gnome-contacts
          - simple-scan
          - gnome-maps
          - gnome-tour
        state: absent
      become: yes
      become_user: root

    - name: Install Syncthing
      kewlfft.aur.aur:
        name:
          - syncthing
        use: yay
        state: present
      become: no

    - name: Start Syncthing Service
      ansible.builtin.systemd_service:
        name: syncthing
        state: started
        enabled: true
        scope: user
      register: syncthing

    - name: Start tailscaled
      ansible.builtin.systemd_service:
        name: tailscaled
        state: started
        enabled: true
      become: yes

    - name: Install Reflector
      kewlfft.aur.aur:
        name:
          - reflector
        use: yay
        state: present
      become: no

    - name: Update mirrorlist
      ansible.builtin.shell: |
        cp /etc/pacman.d/mirrorlist /etc/pacman.d/mirrorlist.bak
        reflector --verbose --latest 10 --protocol https --sort rate --save /etc/pacman.d/mirrorlist
      become: yes
