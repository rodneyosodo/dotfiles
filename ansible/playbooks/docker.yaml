- name: Docker Setup After Install
  hosts: 127.0.0.1
  tasks:
    - name: Install Docker if not already installed
      community.general.pacman:
        name:
          - docker
          - docker-buildx
          - docker-compose
        state: present
      become: yes

    - name: Start Docker
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: true
      become: yes

    # Whoever runs the playbook. Membership of `docker` is root-equivalent;
    # it takes effect at the next login.
    - name: Add Current User to Docker Group
      ansible.builtin.user:
        name: "{{ ansible_facts['env']['USER'] }}"
        groups: docker
        append: true
      become: yes
