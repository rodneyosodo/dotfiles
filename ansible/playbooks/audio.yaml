- name: Setup Audio
  hosts: 127.0.0.1
  tasks:
    - name: Install Bluetooth Utilities
      community.general.pacman:
        name:
          - bluez
          - blueman
          - bluez-utils
        state: present
      become: yes

    - name: Add Bluetooth Module to Linux Kernel
      community.general.modprobe:
        name: btusb
        state: present
      become: yes

    - name: Start Bluetooth Service
      ansible.builtin.systemd_service:
        name: bluetooth
        state: started
        enabled: true
      become: yes

    - name: Install Audio Utilities
      community.general.pacman:
        name:
          - pulseaudio
          - pulseaudio-alsa
          - pulseaudio-bluetooth
          - pulseaudio-jack
          - pavucontrol
        state: present
      become: yes
